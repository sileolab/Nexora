[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexora"
version = "1.0.0"
description = "Universal Website Crawler & RAG Data Extraction Studio"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
nexora = "nexora.cli:main"
crawlbot = "nexora.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["app*", "nexora*", "crawlbot*"]
