<svg fill="none" viewBox="0 0 1200 320" width="100%" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .banner-container {
          background: linear-gradient(135deg, #060911 0%, #0b1120 50%, #020617 100%);
          border-radius: 16px;
          border: 1px solid rgba(56, 189, 248, 0.25);
          box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1);
          padding: 38px 48px;
          box-sizing: border-box;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          position: relative;
          overflow: hidden;
          height: 320px;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
        }
        .glow-orb-1 {
          position: absolute;
          top: -80px;
          right: -80px;
          width: 320px;
          height: 320px;
          background: radial-gradient(circle, rgba(6, 182, 212, 0.25) 0%, rgba(59, 130, 246, 0.05) 60%, transparent 80%);
          filter: blur(40px);
          pointer-events: none;
          animation: floatOrb 8s ease-in-out infinite alternate;
        }
        .glow-orb-2 {
          position: absolute;
          bottom: -80px;
          left: 100px;
          width: 280px;
          height: 280px;
          background: radial-gradient(circle, rgba(16, 185, 129, 0.2) 0%, transparent 70%);
          filter: blur(50px);
          pointer-events: none;
        }
        @keyframes floatOrb {
          0% { transform: translate(0, 0) scale(1); }
          100% { transform: translate(-30px, 30px) scale(1.15); }
        }
        .top-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          z-index: 2;
        }
        .brand-tag {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          padding: 4px 12px;
          background: rgba(6, 182, 212, 0.12);
          border: 1px solid rgba(6, 182, 212, 0.35);
          border-radius: 9999px;
          font-size: 12px;
          font-weight: 600;
          color: #38bdf8;
          letter-spacing: 0.05em;
          text-transform: uppercase;
        }
        .live-dot {
          width: 8px;
          height: 8px;
          background: #10b981;
          border-radius: 50%;
          box-shadow: 0 0 10px #10b981;
          animation: pulseDot 2s infinite;
        }
        @keyframes pulseDot {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.4; transform: scale(0.85); }
        }
        .title-area {
          z-index: 2;
          margin-top: 10px;
        }
        .main-title {
          font-size: 42px;
          font-weight: 800;
          letter-spacing: -0.03em;
          line-height: 1.1;
          background: linear-gradient(135deg, #ffffff 30%, #93c5fd 70%, #38bdf8 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin: 0 0 10px 0;
        }
        .subtitle {
          font-size: 17px;
          color: #94a3b8;
          font-weight: 400;
          max-width: 860px;
          line-height: 1.5;
          margin: 0;
        }
        .pill-grid {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          z-index: 2;
          margin-top: 14px;
        }
        .feature-pill {
          background: rgba(30, 41, 59, 0.7);
          border: 1px solid rgba(148, 163, 184, 0.2);
          padding: 6px 14px;
          border-radius: 8px;
          font-size: 13px;
          font-weight: 500;
          color: #e2e8f0;
          display: inline-flex;
          align-items: center;
          gap: 6px;
        }
        .pill-cyan { color: #38bdf8; }
        .pill-emerald { color: #34d399; }
        .pill-purple { color: #c084fc; }
        .pill-amber { color: #fbbf24; }
      </style>
      <div class="banner-container">
        <div class="glow-orb-1"></div>
        <div class="glow-orb-2"></div>
        
        <div class="top-row">
          <div class="brand-tag">
            <span class="live-dot"></span>
            Enterprise Production Platform • v5.0.0
          </div>
          <div style="color: #64748b; font-size: 13px; font-weight: 600; font-family: monospace;">
            100% TEST PASSING • 474/474
          </div>
        </div>

        <div class="title-area">
          <h1 class="main-title">⚡ NEXORA STUDIO</h1>
          <p class="subtitle">
            Autonomous Web Intelligence, 4-Engine Extraction, Dynamic Anti-Bot Bypass, Semantic Chunking &amp; Rigorous IR Benchmark Evaluation Platform for Enterprise RAG.
          </p>
        </div>

        <div class="pill-grid">
          <div class="feature-pill"><span class="pill-cyan">✦</span> 4-Engine Extraction Cascade</div>
          <div class="feature-pill"><span class="pill-emerald">✦</span> Playwright Chromium Headless</div>
          <div class="feature-pill"><span class="pill-purple">✦</span> Hybrid Dense + BM25 Vector Store</div>
          <div class="feature-pill"><span class="pill-amber">✦</span> Information Retrieval (IR) Studio</div>
          <div class="feature-pill"><span class="pill-cyan">✦</span> Python SDK &amp; Developer CLI</div>
          <div class="feature-pill"><span class="pill-emerald">✦</span> Multi-Tenant Workspaces &amp; BYOK</div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
